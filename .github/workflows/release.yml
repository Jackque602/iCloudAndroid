name: Release APK

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version name for a manual build (e.g. 0.2.0)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Resolve version
        id: version
        run: |
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            version="${GITHUB_REF_NAME#v}"
          elif [[ -n "${{ github.event.inputs.version }}" ]]; then
            version="${{ github.event.inputs.version }}"
          else
            version="0.0.${{ github.run_number }}"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build debug APK
        run: |
          ./gradlew assembleDebug \
            -PappVersionName="${{ steps.version.outputs.version }}" \
            -PappVersionCode=${{ github.run_number }} \
            --no-daemon

      - name: Stage APK
        run: |
          mkdir -p release
          cp app/build/outputs/apk/debug/app-debug.apk \
            "release/iCloudPhotos-${{ steps.version.outputs.version }}.apk"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: iCloud Photos v${{ steps.version.outputs.version }}
          generate_release_notes: true
          files: release/*.apk
          body: |
            Debug-signed APK, ready to sideload — download `iCloudPhotos-${{ steps.version.outputs.version }}.apk` below and install it (you'll need to allow "install unknown apps" for your browser/file manager the first time).

            This is an unofficial iCloud Photos client; see the repo README for what it does and its known limitations.
